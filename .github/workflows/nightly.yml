# Nightly CONFLUX refresh — free forever on public repos.
# 13:15 UTC = 18:45 IST, ~3h after NSE close so the bhavcopy is published.
#
# HONEST CAVEAT: NSE sometimes blocks datacenter IPs (GitHub runners). The
# bhavcopy archives host usually works, but if this job shows repeated
# bhavcopy failures, fall back to running locally:
#     python -m scripts.run_daily_v2      (with CONFLUX_DATABASE_URL in .env)
# Same command, your home IP, writes to the same Neon DB. The site updates
# either way — the API only ever reads Postgres.
name: nightly-refresh
on:
  schedule:
    - cron: "15 13 * * 1-5"
  workflow_dispatch: {}      # manual "Run workflow" button for catch-up days
concurrency: nightly
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Daily pipeline (ingest -> score -> confluence)
        env:
          CONFLUX_DATABASE_URL: ${{ secrets.CONFLUX_DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m scripts.run_daily_v2
